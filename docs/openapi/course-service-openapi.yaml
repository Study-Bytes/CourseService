openapi: 3.1.0
info:
  title: CourseService API
  description: Course content and structure service API.
  version: v1
servers:
- url: https://dev-api.studybytes.ru/course-service
  description: Development gateway through Nginx
- url: http://localhost:8082
  description: Local direct access
- url: http://course-service:8082
  description: Docker backend network
tags:
- name: System
  description: Technical health and readiness checks
- name: Public courses
  description: Public read endpoints for published course previews
- name: Internal Course API
  description: Trusted backend endpoints for LearningService and BFF integrations
- name: Admin Course API
  description: Teacher/admin API for creating and editing course content
paths:
  /api/v1/admin/modules/{moduleId}:
    put:
      tags:
      - Admin Course API
      summary: Update module
      description: Updates module metadata and order.
      operationId: updateModule
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminModuleResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Admin Course API
      summary: Delete module
      description: Deletes a module and all its course items.
      operationId: deleteModule
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/v1/admin/modules/{moduleId}/items/reorder:
    put:
      tags:
      - Admin Course API
      summary: Reorder course items
      description: Rewrites item order indexes for the whole module.
      operationId: reorderItems
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderItemsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminModuleResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}:
    get:
      tags:
      - Admin Course API
      summary: Get admin course details
      description: Returns course metadata with modules and item summaries.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Admin Course API
      summary: Update course
      description: Updates course metadata.
      operationId: updateCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/modules/reorder:
    put:
      tags:
      - Admin Course API
      summary: Reorder modules
      description: Rewrites module order indexes for the whole course.
      operationId: reorderModules
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderModulesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/course-items/{itemId}:
    get:
      tags:
      - Admin Course API
      summary: Get admin course item details
      description: "Returns course item with content blocks, hints, tests and quiz\
        \ options."
      operationId: getItem
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Admin Course API
      summary: Update course item
      description: Updates base metadata and execution/evaluation settings for a course
        item.
      operationId: updateItem
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Admin Course API
      summary: Delete course item
      description: "Deletes a course item and its content blocks, hints, tests and\
        \ quiz options."
      operationId: deleteItem
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/v1/admin/course-items/{itemId}/test-cases:
    put:
      tags:
      - Admin Course API
      summary: Replace test cases
      description: Replaces all test cases for a course item. Admin response includes
        expected output.
      operationId: replaceTestCases
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTestCasesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/course-items/{itemId}/options:
    put:
      tags:
      - Admin Course API
      summary: Replace quiz options
      description: Replaces all quiz options for a course item. Admin response includes
        correct flags.
      operationId: replaceOptions
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceQuizOptionsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/course-items/{itemId}/hints:
    put:
      tags:
      - Admin Course API
      summary: Replace hints
      description: Replaces all hints for a course item.
      operationId: replaceHints
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceHintsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/course-items/{itemId}/content-blocks:
    put:
      tags:
      - Admin Course API
      summary: Replace content blocks
      description: Replaces all rich content blocks for a course item.
      operationId: replaceContentBlocks
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceContentBlocksRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/modules/{moduleId}/items:
    post:
      tags:
      - Admin Course API
      summary: Create course item
      description: Creates a course item inside a module.
      operationId: createItem
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseItemRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseItemResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses:
    get:
      tags:
      - Admin Course API
      summary: List admin courses
      description: Returns courses visible to the current admin or teacher with filtering
        and pagination.
      operationId: listCourses
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_REVIEW
          - CHANGES_REQUESTED
          - PUBLISHED
          - ARCHIVED
      - name: difficulty
        in: query
        required: false
        schema:
          type: string
          enum:
          - BEGINNER
          - INTERMEDIATE
          - ADVANCED
      - name: accessType
        in: query
        required: false
        schema:
          type: string
          enum:
          - PUBLIC
          - UNLISTED
          - PRIVATE
      - name: createdByUserId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCoursePageResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Admin Course API
      summary: Create course
      description: Creates a draft course with base metadata.
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/submit-review:
    post:
      tags:
      - Admin Course API
      summary: Submit course for review
      description: Validates course structure and moves a draft or changes-requested
        course to pending review.
      operationId: submitCourseForReview
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/reject:
    post:
      tags:
      - Admin Course API
      summary: Reject course
      description: Rejects a pending-review course with a moderation comment.
      operationId: rejectCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseModerationReviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/publish:
    post:
      tags:
      - Admin Course API
      summary: Publish course
      description: Marks a course as published and sets publishedAt if missing.
      operationId: publishCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/modules:
    post:
      tags:
      - Admin Course API
      summary: Create module
      description: Creates a module inside a course.
      operationId: createModule
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminModuleResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/archive:
    post:
      tags:
      - Admin Course API
      summary: Archive course
      description: Marks a course as archived.
      operationId: archiveCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/{courseId}/approve:
    post:
      tags:
      - Admin Course API
      summary: Approve course
      description: Approves a pending-review course and publishes it.
      operationId: approveCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /ready:
    get:
      tags:
      - System
      summary: Readiness check
      description: Returns service readiness status.
      operationId: ready
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /health:
    get:
      tags:
      - System
      summary: Health check
      description: Returns service health status.
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/internal/courses/{courseId}/availability:
    get:
      tags:
      - Internal Course API
      summary: Get course availability
      description: "Returns publication, access and enrollment state for LearningService\
        \ enrollment checks."
      operationId: getCourseAvailability
      parameters:
      - name: courseId
        in: path
        description: Course id
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Course availability returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseAvailabilityResponse"
        "401":
          description: Missing or invalid internal API key
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseAvailabilityResponse"
        "404":
          description: Course not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseAvailabilityResponse"
      security:
      - internalApiKey: []
  /api/v1/internal/course-items/{itemId}/execution-package:
    get:
      tags:
      - Internal Course API
      summary: Get course item execution package
      description: "Returns full execution data for a course item, including hidden\
        \ tests and expected outputs. Intended only for trusted backend services."
      operationId: getExecutionPackage
      parameters:
      - name: itemId
        in: path
        description: Course item id
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "200":
          description: Execution package returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExecutionPackageResponse"
        "401":
          description: Missing or invalid internal API key
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExecutionPackageResponse"
        "404":
          description: Course item not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExecutionPackageResponse"
      security:
      - internalApiKey: []
  /api/v1/internal/course-items/{itemId}/content:
    get:
      tags:
      - Internal Course API
      summary: Get enrolled-student-safe course item content
      description: "Returns full course item content for trusted backend services\
        \ after enrollment checks. Does not expose hidden tests, expected outputs\
        \ or correct quiz answers."
      operationId: getCourseItemContent
      parameters:
      - name: itemId
        in: path
        description: Course item id
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "200":
          description: Course item content returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseItemContentResponse"
        "401":
          description: Missing or invalid internal API key
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseItemContentResponse"
        "404":
          description: Course item not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalCourseItemContentResponse"
      security:
      - internalApiKey: []
  /api/v1/courses:
    get:
      tags:
      - Public courses
      summary: Get published course catalog
      description: "Returns published public courses only. Private, archived and draft\
        \ courses are not included."
      operationId: getPublishedCourseCatalog
      responses:
        "200":
          description: Published public course catalog
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourseCatalogResponse"
  /api/v1/courses/{courseId}:
    get:
      tags:
      - Public courses
      summary: Get published course details
      description: Returns course details with modules and course item summaries.
        Only published PUBLIC or UNLISTED courses are readable.
      operationId: getPublishedCourseDetails
      parameters:
      - name: courseId
        in: path
        description: Course identifier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Published course details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourseDetailsResponse"
        "404":
          description: Course not found or not publicly readable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/course-items/{itemId}:
    get:
      tags:
      - Public courses
      summary: Get published course item preview
      description: Returns safe public course item preview only. Full item content
        is available through trusted internal endpoints after enrollment checks.
      operationId: getPublishedCourseItemPreview
      parameters:
      - name: itemId
        in: path
        description: Course item identifier
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Published course item preview
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourseItemPreviewResponse"
        "404":
          description: Course item not found or not publicly readable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/admin/courses/{courseId}/review:
    get:
      tags:
      - Admin Course API
      summary: Get course review details
      description: Returns full admin course details for moderation review.
      operationId: getCourseReview
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCourseResponse"
      security:
      - bearerAuth: []
  /api/v1/admin/courses/moderation:
    get:
      tags:
      - Admin Course API
      summary: List moderation queue
      description: Returns pending-review courses ordered by oldest submission first.
      operationId: listModerationQueue
      parameters:
      - name: difficulty
        in: query
        required: false
        schema:
          type: string
          enum:
          - BEGINNER
          - INTERMEDIATE
          - ADVANCED
      - name: accessType
        in: query
        required: false
        schema:
          type: string
          enum:
          - PUBLIC
          - UNLISTED
          - PRIVATE
      - name: createdByUserId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCoursePageResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateModuleRequest:
      type: object
      properties:
        title:
          type: string
          writeOnly: true
        description:
          type: string
          writeOnly: true
        orderIndex:
          type: integer
          format: int32
          writeOnly: true
        deadlineAt:
          type: string
          format: date-time
          writeOnly: true
    AdminContentBlockResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        blockType:
          type: string
          enum:
          - TEXT
          - VIDEO
          - IMAGE
          - CODE
          - EMBED
          - FILE
        orderIndex:
          type: integer
          format: int32
        title:
          type: string
        textContent:
          type: string
        url:
          type: string
        language:
          type: string
        metadataJson:
          type: string
    AdminCourseItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        moduleId:
          type: integer
          format: int64
        title:
          type: string
        itemType:
          type: string
          enum:
          - CODING
          - SQL
          - QUIZ
          - THEORY
          - FILE
        statement:
          type: string
        starterCode:
          type: string
        language:
          type: string
        orderIndex:
          type: integer
          format: int32
        timeLimitMs:
          type: integer
          format: int32
        memoryLimitMb:
          type: integer
          format: int32
        outputLimitKb:
          type: integer
          format: int32
        networkDisabled:
          type: boolean
        readOnlyFs:
          type: boolean
        comparisonMode:
          type: string
          enum:
          - EXACT
        normalizeLineEndings:
          type: boolean
        trimTrailingWhitespaces:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contentBlocks:
          type: array
          items:
            $ref: "#/components/schemas/AdminContentBlockResponse"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/AdminHintResponse"
        testCases:
          type: array
          items:
            $ref: "#/components/schemas/AdminTestCaseResponse"
        options:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuizOptionResponse"
    AdminHintResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderIndex:
          type: integer
          format: int32
        text:
          type: string
    AdminModuleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        courseId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        orderIndex:
          type: integer
          format: int32
        deadlineAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminCourseItemResponse"
    AdminQuizOptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderIndex:
          type: integer
          format: int32
        label:
          type: string
        text:
          type: string
        correct:

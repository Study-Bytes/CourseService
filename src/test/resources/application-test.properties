spring.application.name=CourseServiceTest

server.port=0

spring.datasource.url=jdbc:h2:mem:course_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.demo-data.enabled=false

app.internal-api-key=test-course-service-internal-key

app.security.jwt.secret=test-course-service-jwt-secret-key-which-is-at-least-32-bytes-long
app.security.jwt.roles-claim=roles
app.security.jwt.role-prefix=ROLE_

spring.application.name=CourseServiceTest

server.port=0

spring.datasource.url=jdbc:h2:mem:course_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.demo-data.enabled=false

app.internal-api-key=test-course-service-internal-key

# Tests use MockMvc security annotations for admin checks.
# These JWT resource-server values are placeholders for application context startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://user-service-test:8081
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://user-service-test:8081/api/v1/auth/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=study-platform

app.security.jwt.roles-claim=roles
app.security.jwt.role-prefix=ROLE_

# Production-like profile.
# Flyway migrations are not introduced yet, so ddl-auto remains update for now.
# Switch to validate after the Flyway migration task is completed.

app.demo-data.enabled=false

server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${COURSE_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${COURSE_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${COURSE_SERVICE_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.studyplatform=INFO

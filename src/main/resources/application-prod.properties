# Production-like profile.
# Flyway owns schema migrations; Hibernate only validates the mapped schema.

app.demo-data.enabled=false

server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${COURSE_SERVICE_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${COURSE_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${COURSE_SERVICE_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=${COURSE_SERVICE_FLYWAY_ENABLED:true}
spring.flyway.locations=${COURSE_SERVICE_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.default-schema=${COURSE_SERVICE_FLYWAY_SCHEMA:public}
spring.flyway.baseline-on-migrate=${COURSE_SERVICE_FLYWAY_BASELINE_ON_MIGRATE:false}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.studyplatform=INFO
logging.pattern.level=%5p [requestId:%X{requestId:-}]

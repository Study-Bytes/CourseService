spring.application.name=CourseService

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/course_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.studyplatform=DEBUG

app.internal-api-key=dev-course-service-internal-key
# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-default-pretty-printer=true
springdoc.packages-to-scan=org.studyplatform.courseservice.controller
springdoc.paths-to-match=/api/v1/**,/health,/ready

 # Demo data seeding is disabled by default. Enable it with the dev profile.
app.demo-data.enabled=false

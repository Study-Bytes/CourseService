spring.application.name=CourseService

server.port=${COURSE_SERVICE_PORT:8082}

spring.datasource.url=${COURSE_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/course_service}
spring.datasource.username=${COURSE_SERVICE_DB_USERNAME:postgres}
spring.datasource.password=${COURSE_SERVICE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${COURSE_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${COURSE_SERVICE_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${COURSE_SERVICE_JPA_FORMAT_SQL:true}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.studyplatform=DEBUG

app.internal-api-key=${COURSE_SERVICE_INTERNAL_API_KEY:dev-course-service-internal-key}
# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-default-pretty-printer=true
springdoc.packages-to-scan=org.studyplatform.courseservice.controller
springdoc.paths-to-match=/api/v1/**,/health,/ready

 # Demo data seeding is disabled by default. Enable it with the dev profile.
app.demo-data.enabled=false

# JWT security for admin endpoints.
# UserService issues RS256-signed JWT tokens and exposes public keys through JWKS.
# CourseService verifies tokens only; it must not store UserService private keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${USER_SERVICE_JWT_ISSUER_URI:http://user-service:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_JWT_JWK_SET_URI:http://user-service:8081/api/v1/auth/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${USER_SERVICE_JWT_AUDIENCE:study-platform}

app.security.jwt.roles-claim=${COURSE_SERVICE_JWT_ROLES_CLAIM:roles}
app.security.jwt.role-prefix=${COURSE_SERVICE_JWT_ROLE_PREFIX:ROLE_}

name: CourseService CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: course-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, OpenAPI and Docker check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: course_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d course_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COURSE_SERVICE_DB_URL: jdbc:postgresql://localhost:5432/course_service
      COURSE_SERVICE_DB_USERNAME: postgres
      COURSE_SERVICE_DB_PASSWORD: postgres
      COURSE_SERVICE_INTERNAL_API_KEY: dev-course-service-internal-key
      USER_SERVICE_JWT_ISSUER_URI: http://user-service:8081
      USER_SERVICE_JWT_JWK_SET_URI: http://user-service:8081/api/v1/auth/.well-known/jwks.json
      USER_SERVICE_JWT_AUDIENCE: study-platform
      COURSE_SERVICE_JWT_ROLES_CLAIM: roles
      COURSE_SERVICE_JWT_ROLE_PREFIX: ROLE_

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Generate local OpenAPI contract
        run: ./mvnw -B verify -Popenapi

      - name: Check OpenAPI contract is committed
        run: git diff --exit-code docs/openapi/course-service-openapi.yaml

      - name: Build Docker image
        run: docker build -t studybytes/course-service:ci .

  deploy:
    name: Deploy CourseService to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          test -n "$VPS_HOST" || (echo "VPS_HOST secret is missing" && exit 1)
          test -n "$VPS_PORT" || (echo "VPS_PORT secret is missing" && exit 1)
          test -n "$VPS_USER" || (echo "VPS_USER secret is missing" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "VPS_SSH_KEY secret is missing" && exit 1)
          test -n "$VPS_DEPLOY_PATH" || (echo "VPS_DEPLOY_PATH secret is missing" && exit 1)

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/course_service_deploy_key
          chmod 600 ~/.ssh/course_service_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/course_service_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd '$VPS_DEPLOY_PATH'
             test -f .env || (echo '.env is missing on VPS. Create it before deployment.' && exit 1)
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             docker compose up -d --build
             docker compose ps
             curl -f --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8082/health"
